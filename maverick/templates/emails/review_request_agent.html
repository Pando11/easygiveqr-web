<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Review Request</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f8fafc; color:#0f172a; margin:0; padding:20px;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:680px; margin:0 auto; background:#ffffff; border:1px solid #e2e8f0; border-radius:10px;">
        <tr>
            <td style="padding:20px 24px; border-bottom:1px solid #e2e8f0;">
                <h2 style="margin:0; color:#1d4ed8;">Quick Favor: Share Your Feedback</h2>
                <p style="margin:8px 0 0;">{{ property_address }}</p>
            </td>
        </tr>
        <tr>
            <td style="padding:20px 24px;">
                <p style="margin:0 0 12px;">Hi {{ agent_name }},</p>
                <p style="margin:0 0 12px;">
                    Could you take 30 seconds to rate your Maverick TC experience and leave a short testimonial?
                </p>
                <p style="margin:0 0 14px;">
                    <a href="{{ review_link }}" target="_blank" rel="noopener" style="display:inline-block; background:#1d4ed8; color:#ffffff; text-decoration:none; padding:10px 14px; border-radius:6px;">
                        Leave a review
                    </a>
                </p>
                <p style="margin:0;">Thank you for your partnership.</p>
            </td>
        </tr>
    </table>
</body>
</html>
